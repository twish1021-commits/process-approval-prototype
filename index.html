<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>流程审批原型 · 手机端 & 云后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;background:#dde3ee;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 0 60px;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
.page-hint{font-size:12px;color:#a0a8b8;margin-bottom:14px;letter-spacing:.4px}

/* ── 平台切换 ── */
.platform-switch{display:flex;gap:0;margin-bottom:20px;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ps-btn{padding:10px 28px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:#888;transition:all .2s;user-select:none;border:none}
.ps-btn.active{background:#1677FF;color:#fff}

/* ═══════════════ 手机端 ═══════════════ */
/* 设备框按 iPhone 15 Pro 真实比例 393×852（约 1:2.17） */
.mobile-view{display:flex;flex-direction:column;align-items:center;width:100%}
.device{
  width:clamp(300px,360px,393px);
  aspect-ratio:393/852;
  border-radius:44px;
  box-shadow:0 0 0 2px #555,0 0 0 11px #1a1a1a,0 0 0 13px #444,0 36px 90px rgba(0,0,0,.4);
  overflow:hidden;background:#1a1a1a;position:relative;
  max-height:92vh
}
.notch-bar{height:30px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notch-pill{width:92px;height:14px;background:#080808;border-radius:9px}
.screen{flex:1;overflow:hidden;background:#f1f2f6;display:flex;flex-direction:column;position:relative;min-height:0}
.home-bar-wrap{height:22px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.home-bar{width:114px;height:4px;background:#444;border-radius:3px}

/* ── 折叠屏展开适配（视口 ≥600px，如 Galaxy Z Fold 展开态 768px） ── */
@media(min-width:600px){
  .device{width:clamp(360px,393px,420px);max-height:88vh}
  .sbar-time{font-size:16px}
  .nav-ttl{font-size:18px}
  .card-title{font-size:16px}
  .tab{font-size:15px}
  .field .flabel{font-size:14px}
  .field .fval{font-size:14px}
}

/* ── 超小屏适配（<360px，如 iPhone SE 1st） ── */
@media(max-width:359px){
  .device{width:96vw;border-radius:32px;aspect-ratio:auto;height:84vh;max-height:none}
  .navbar{padding:6px 8px 8px}
  .nav-ttl{font-size:15px}
  .card-title{font-size:14px}
  .tab{font-size:13px}
  .scroll{padding:8px 10px 14px}
  .batch-btn{font-size:14px}
}

.sbar{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:9px 22px 6px;flex-shrink:0}
.sbar-time{font-size:15px;font-weight:700;color:#111;letter-spacing:-.3px}
.sbar-right{display:flex;align-items:center;gap:5px}

.navbar{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:7px 12px 9px;border-bottom:1px solid #efefef;flex-shrink:0}
.nav-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;transition:background .15s}
.nav-icon:active{background:#f0f0f0}
.nav-back{display:flex;align-items:center;gap:4px}
.nav-back .badge-num{background:#ff3b30;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;line-height:20px;border-radius:10px;padding:0 6px;text-align:center;display:inline-block}
.nav-center{text-align:center}
.nav-ttl{font-size:17px;font-weight:700;color:#111;letter-spacing:-.2px}
.nav-url{font-size:10px;color:#c0c0c0;margin-top:1px}

.tabbar{background:#fff;display:flex;border-bottom:1px solid #ebebeb;flex-shrink:0}
.tab{flex:1;text-align:center;padding:12px 0 11px;font-size:14px;color:#aaa;cursor:pointer;position:relative;transition:color .18s;user-select:none;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:500}
.tab.active{color:#1677FF;font-weight:700}
.tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2.5px;background:#1677FF;border-radius:2px}
.num-dot{background:#ff3b30;color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;border-radius:9px;padding:0 4px;display:inline-block}

.action-bar{display:flex;align-items:center;justify-content:flex-end;padding:8px 14px 6px;background:#f1f2f6;flex-shrink:0}
.multi-entry-btn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:#1677FF;cursor:pointer;padding:5px 12px;border-radius:20px;background:#fff;border:1px solid #d4e4ff;box-shadow:0 1px 3px rgba(22,119,255,.1);transition:background .15s;user-select:none}
.multi-entry-btn:active{background:#eef5ff}
.multi-entry-btn svg{flex-shrink:0}

.multibar{display:none;align-items:center;justify-content:space-between;padding:10px 14px;background:#EEF5FF;border-bottom:1px solid #d4e4ff;flex-shrink:0}
.multibar.show{display:flex}
.multibar-left{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sel-all-txt{font-size:14px;color:#1677FF;font-weight:600}
.sel-count{font-size:13px;color:#888}
.cancel-sel{font-size:14px;color:#1677FF;cursor:pointer;font-weight:500;padding:4px 2px;user-select:none}

.rcheck{width:22px;height:22px;border-radius:50%;border:2px solid #ccc;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.rcheck.checked{background:#1677FF;border-color:#1677FF}
.rcheck.checked::after{content:'';width:5px;height:9px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(42deg) translateY(-1px);display:block}
.rcheck.partial{background:#1677FF;border-color:#1677FF}
.rcheck.partial::after{content:'';width:10px;height:2px;background:#fff;display:block;border-radius:1px}

.scroll{flex:1;overflow-y:auto;padding:10px 12px 16px}
.scroll::-webkit-scrollbar{display:none}

.card{background:#fff;border-radius:14px;margin-bottom:10px;cursor:pointer;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07);transition:transform .12s,box-shadow .12s,background .15s;display:flex;align-items:stretch}
.card-stripe{width:4px;flex-shrink:0}
.card-todo .card-stripe{background:#ff8c00}
.card-mine .card-stripe{background:#1677FF}
.card-approved .card-stripe{background:#22c55e}
.card-rejected .card-stripe{background:#ef4444}
.card:active{transform:scale(.976);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card.selected{background:#EFF6FF}
.card.selected .card-stripe{background:#1677FF}

.card-cb-col{width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:width .18s ease}
.card-cb-col.visible{width:46px}
.card-body{flex:1;padding:13px 14px 12px 14px;min-width:0}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.card-title{font-size:15px;font-weight:600;color:#111;flex:1;line-height:1.45;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sticker{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.sticker-todo{background:#fff4e6;color:#e07800}
.sticker-mine{background:#e6f4ff;color:#1677ff}
.sticker-approved{background:#edfdf4;color:#16a34a}
.sticker-rejected{background:#fef2f2;color:#dc2626}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:9px;border-top:1px solid #f5f5f5}
.type-pill{font-size:11px;color:#888;background:#f5f6f8;border-radius:5px;padding:3px 8px}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.card-time{font-size:11px;color:#c0c0c0}
.card-who{font-size:11px;color:#c0c0c0}
.done-flag{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.flag-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.flag-ok{color:#16a34a}.flag-ok .flag-dot{background:#22c55e}
.flag-no{color:#dc2626}.flag-no .flag-dot{background:#ef4444}
.empty-state{text-align:center;padding:64px 0;color:#ccc}
.empty-icon{font-size:46px;display:block;margin-bottom:10px}

.batch-bar{display:none;gap:10px;padding:10px 14px 12px;background:#fff;border-top:1px solid #f0f0f0;flex-shrink:0}
.batch-bar.show{display:flex}
.batch-btn{flex:1;padding:13px 0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.batch-reject{border:1.5px solid #ef4444;color:#ef4444;background:#fff}
.batch-reject:active{background:#fef2f2}
.batch-approve{background:#07C160;color:#fff;border:none}
.batch-approve:active{opacity:.82}
.batch-btn.disabled{opacity:.35;pointer-events:none}

.detail-wrap{display:none;flex-direction:column;flex:1;overflow:hidden}
.detail-wrap.show{display:flex}
.list-wrap{display:flex;flex-direction:column;flex:1;overflow:hidden}
.list-wrap.hide{display:none}
.detail-scroll{flex:1;overflow-y:auto}
.detail-scroll::-webkit-scrollbar{display:none}
.sec-hd{font-size:15px;font-weight:700;color:#111;padding:14px 16px 10px;display:flex;align-items:center;gap:8px;background:#fff}
.sec-hd::before{content:'';width:3px;height:16px;background:#1677FF;border-radius:3px;flex-shrink:0}
.dtab-wrap{display:flex;margin:0 16px 14px;border-radius:10px;overflow:hidden;border:1.5px solid #1677FF}
.dtab{flex:1;text-align:center;padding:9px 0;font-size:14px;cursor:pointer;transition:all .18s;user-select:none}
.dtab.on{background:#1677FF;color:#fff;font-weight:600}
.dtab:not(.on){color:#1677FF;background:#fff}
.field-group{background:#fff;margin-bottom:10px}
.field{display:flex;align-items:flex-start;padding:10px 16px;border-bottom:1px solid #f5f5f5}
.field:last-child{border-bottom:none}
.flabel{font-size:13px;color:#bbb;width:80px;flex-shrink:0;padding-top:2px;line-height:1.5}
.fval{font-size:14px;color:#222;flex:1;line-height:1.6;word-break:break-all}

/* ── 变更高亮 ── */
.field.changed{background:#f0f7ff}
.field.changed .flabel{color:#1677FF;font-weight:600}
.field.changed .fval{color:#1677FF;font-weight:600}
.field.changed .fval::before{content:'📍 ';font-size:12px}

/* ── 门店展开 ── */
.store-toggle{color:#1677FF;cursor:pointer;font-weight:600;user-select:none;display:inline-flex;align-items:center;gap:3px}
.store-toggle:active{opacity:.7}
.store-toggle svg{transition:transform .2s}
.store-toggle.expanded svg{transform:rotate(180deg)}
.store-list{display:none;margin-top:8px;padding:8px 10px;background:#f8f9fb;border-radius:8px;border:1px solid #eee}
.store-list.show{display:block}
.store-list-item{font-size:13px;color:#555;padding:3px 0;line-height:1.5}
.store-list-item::before{content:'• ';color:#ccc}

/* ── 详情页结构化字段 ── */
.fval-empty{color:#bbb;font-size:13px}
.field-stack{flex-direction:column;align-items:flex-start!important;gap:8px!important;padding:12px 14px 14px!important}
.field-stack .flabel{padding-right:0;margin-bottom:2px}

/* 活动详情卡 */
.info-card{flex:1;width:100%;background:#f8fafc;border:1px solid #edf1f5;border-radius:8px;padding:8px 0}
.info-row{display:flex;align-items:flex-start;padding:6px 12px;gap:8px}
.info-row+.info-row{border-top:1px dashed #e8edf2}
.info-k{font-size:12px;color:#94a3b8;flex-shrink:0;width:42px;padding-top:2px}
.info-v{font-size:13px;color:#222;line-height:1.6;flex:1;min-width:0}
.gift-v{display:flex;flex-direction:column;gap:4px}
.gift-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gift-dot{width:4px;height:4px;border-radius:50%;background:#94a3b8;flex-shrink:0}
.gift-name{font-size:13px;color:#222}
.gift-qty{font-size:12px;color:#1677FF;font-weight:600;background:#EEF5FF;padding:1px 6px;border-radius:4px}
.gift-period{font-size:11px;color:#94a3b8}

/* 活动对象标签 */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.tag-list-visible{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-list-hidden{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;width:100%}
.tag-chip{display:inline-block;background:#f1f5f9;color:#475569;font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid #e2e8f0}
.tag-more{display:inline-block;background:#EEF5FF;color:#1677FF;font-size:12px;padding:3px 9px;border-radius:12px;cursor:pointer;font-weight:600;user-select:none}
.tag-more:active{opacity:.7}

/* 方案标签对 */
.tag-pairs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-pair{display:inline-block;background:#fff5e6;color:#a16207;font-size:12px;padding:3px 9px;border-radius:4px;border:1px solid #fde68a}
.tag-pair-v{color:#92400e;font-weight:600}

/* 销售渠道 */
.ch-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ch-chip{display:inline-block;background:#f0f9ff;color:#0369a1;font-size:12px;padding:3px 9px;border-radius:4px;border:1px solid #bae6fd}
.ch-shop{background:#fef3c7;color:#92400e;border-color:#fde68a}
.ch-sep{color:#cbd5e1;font-size:13px;margin:0 2px}


.gap-block{height:10px;background:#f1f2f6;flex-shrink:0}
.opinion-wrap{background:#fff;padding:0 16px 16px}
.opinion-lbl{font-size:13px;color:#bbb;margin-bottom:8px;padding-top:14px}
.opinion-ta{width:100%;border:1.5px solid #eee;border-radius:10px;padding:10px 12px;min-height:88px;font-size:14px;color:#333;font-family:inherit;resize:none;outline:none;line-height:1.6;background:#fafafa;transition:border .2s}
.opinion-ta:focus{border-color:#1677FF;background:#fff}
.result-card{margin:0 16px 16px;border-radius:12px;overflow:hidden;border:1px solid #eee;background:#fff}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #f5f5f5}
.result-row:last-child{border-bottom:none}
.rlabel{font-size:13px;color:#bbb}
.rval{font-size:13px;color:#222;font-weight:500}
.chip-ok{font-size:12px;padding:3px 10px;border-radius:20px;background:#edfdf4;color:#16a34a;font-weight:700}
.chip-no{font-size:12px;padding:3px 10px;border-radius:20px;background:#fef2f2;color:#dc2626;font-weight:700}

/* ── 流转日志（时间线） ── */
.flow-log{background:#fff;margin:0 16px;border-radius:12px;padding:14px 16px 14px 4px}
.flow-item{display:flex;gap:12px;position:relative}
.flow-dot-col{width:20px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:3px}
.flow-dot{width:12px;height:12px;border-radius:50%;border:2px solid #c0c0c0;background:#fff;flex-shrink:0;z-index:1}
.flow-dot-first{background:#1677FF;border-color:#1677FF;box-shadow:0 0 0 4px rgba(22,119,255,.12)}
.flow-dot-done{background:#1677FF;border-color:#1677FF}
.flow-dot-pending{background:#fff;border-color:#c0c0c0}
.flow-line{width:2px;flex:1;background:#e5e5e5;margin-top:2px;min-height:18px}
.flow-body{flex:1;padding-bottom:14px;min-width:0}
.flow-item:last-child .flow-body{padding-bottom:0}
.flow-row1{display:flex;align-items:center;gap:6px;font-size:13px;color:#111;font-weight:600;margin-bottom:3px}
.flow-stage{color:#1677FF}
.flow-actor{color:#666;font-weight:500;font-size:12px}
.flow-row2{font-size:11px;color:#999;margin-bottom:4px;font-family:'SF Mono','Consolas',monospace}
.flow-row3{font-size:13px;color:#111}
.flow-row3-pending{color:#999}
.chip-pending{font-size:13px;padding:5px 14px;border-radius:20px;background:#fffbeb;color:#d97706;font-weight:600}
.footer{display:flex;gap:10px;padding:12px 16px 14px;border-top:1px solid #f0f0f0;background:#fff;flex-shrink:0}
.btn-no{flex:1;padding:14px 0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;border:1.5px solid #ef4444;color:#ef4444;background:#fff;text-align:center;transition:background .15s}
.btn-no:active{background:#fef2f2}
.btn-yes{flex:2;padding:14px 0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;background:#07C160;color:#fff;border:none;text-align:center;transition:opacity .15s}
.btn-yes:active{opacity:.82}

.modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:100}
.modal-mask.show{display:flex}
.modal{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:22px 18px 20px;animation:su .2s ease}
@keyframes su{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:16px;font-weight:700;color:#111;text-align:center;margin-bottom:6px}
.modal-sub{font-size:13px;color:#888;text-align:center;margin-bottom:20px;line-height:1.6}
.modal-btns{display:flex;gap:10px}
.m-cancel{flex:1;padding:13px 0;border-radius:10px;font-size:15px;font-weight:600;border:1.5px solid #ddd;color:#666;background:#fff;text-align:center;cursor:pointer}
.m-confirm-yes{flex:1;padding:13px 0;border-radius:10px;font-size:15px;font-weight:600;border:none;color:#fff;background:#07C160;text-align:center;cursor:pointer}
.m-confirm-no{flex:1;padding:13px 0;border-radius:10px;font-size:15px;font-weight:600;border:none;color:#fff;background:#ef4444;text-align:center;cursor:pointer}

.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.84);color:#fff;font-size:14px;padding:10px 22px;border-radius:24px;opacity:0;pointer-events:none;transition:opacity .26s;white-space:nowrap;z-index:200}
.toast.show{opacity:1}

/* ═══════════════ 云后台 ═══════════════ */
.desktop-view{display:none;width:1000px}
.desktop-view.show{display:block}
.dv-header{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);padding:20px 28px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.dv-title{font-size:20px;font-weight:700;color:#111}
.dv-sub{font-size:12px;color:#999;margin-top:2px}
.dv-tabs{display:flex;gap:0;background:#fff;border-radius:12px 12px 0 0;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden}
.dv-tab{padding:14px 32px;font-size:14px;color:#888;cursor:pointer;position:relative;transition:all .18s;user-select:none;font-weight:500;border-bottom:2px solid transparent}
.dv-tab.active{color:#1677FF;font-weight:700;border-bottom-color:#1677FF;background:#f8fbff}
.dv-tab-badge{background:#ff3b30;color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;border-radius:9px;padding:0 4px;display:inline-block;margin-left:4px}

.dv-toolbar{display:none;align-items:center;justify-content:space-between;padding:12px 28px;background:#EEF5FF;border:1px solid #d4e4ff;border-top:none}
.dv-toolbar.show{display:flex}
.dv-tool-left{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.dv-sel-all-txt{font-size:14px;color:#1677FF;font-weight:600}
.dv-sel-count{font-size:13px;color:#888}
.dv-tool-right{display:flex;gap:10px}
.dv-batch-btn{padding:8px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none}
.dv-batch-reject{border:1.5px solid #ef4444;color:#ef4444;background:#fff}
.dv-batch-reject:active{background:#fef2f2}
.dv-batch-approve{background:#07C160;color:#fff;border:none}
.dv-batch-approve:active{opacity:.82}
.dv-batch-btn.disabled{opacity:.35;pointer-events:none}

.dv-table-wrap{background:#fff;border-radius:0 0 12px 12px;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden}
.dv-table{width:100%;border-collapse:collapse}
.dv-table th{background:#f5f7fa;padding:12px 16px;font-size:13px;color:#666;font-weight:600;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}
.dv-table td{padding:14px 16px;font-size:14px;color:#333;border-bottom:1px solid #f5f5f5}
.dv-table tr:hover td{background:#f8fbff}
.dv-table tr:last-child td{border-bottom:none}
.dv-cb-cell{width:44px;text-align:center}

/* ── 排序：按时间倒序 ── */
function sortByTime(arr){
  return arr.slice().sort(function(a,b){
    return new Date(b.time.replace(/-/g,'/'))-new Date(a.time.replace(/-/g,'/'));
  });
}

/* ════════════ 平台切换 ════════════ */
function switchPlatform(type){
  if(type==='mobile'){
    document.getElementById('mobileView').style.display='flex';
    document.getElementById('desktopView').classList.remove('show');
    document.getElementById('psMobile').classList.add('active');
    document.getElementById('psDesktop').classList.remove('active');
  }else{
    document.getElementById('mobileView').style.display='none';
    document.getElementById('desktopView').classList.add('show');
    document.getElementById('psMobile').classList.remove('active');
    document.getElementById('psDesktop').classList.add('active');
    document.getElementById('dvToolbar').classList.toggle('show',dCurTab===0);
    renderDesktopList();
    updateDesktopBadge();
  }
}

/* ════════════ 手机端逻辑 ════════════ */
var curTab=0,multiMode=false,selected=new Set();

function enterMulti(){
  multiMode=true;selected.clear();
  document.getElementById('actionBar').style.display='none';
  document.getElementById('multibar').classList.add('show');
  document.getElementById('batchBar').classList.add('show');
  document.getElementById('tab1').style.pointerEvents='none';document.getElementById('tab1').style.opacity='.4';
  document.getElementById('tab2').style.pointerEvents='none';document.getElementById('tab2').style.opacity='.4';
  renderList();
}
function exitMulti(){
  multiMode=false;selected.clear();
  document.getElementById('actionBar').style.display='';
  document.getElementById('multibar').classList.remove('show');
  document.getElementById('batchBar').classList.remove('show');
  document.getElementById('tab1').style.pointerEvents='';document.getElementById('tab1').style.opacity='';
  document.getElementById('tab2').style.pointerEvents='';document.getElementById('tab2').style.opacity='';
  renderList();
}
function toggleSelectAll(){
  var allIds=DB.todo.map(function(x){return x.id});
  if(selected.size===allIds.length)selected.clear();
  else allIds.forEach(function(id){selected.add(id)});
  renderList();syncMultiUI();
}
function toggleItem(id){
  if(selected.has(id))selected.delete(id);else selected.add(id);
  renderList();syncMultiUI();
}
function syncMultiUI(){
  var n=selected.size,total=DB.todo.length;
  document.getElementById('selCount').textContent='已选 '+n+' 项';
  var box=document.getElementById('allCheck');
  box.className='rcheck';
  if(n===total&&total>0)box.classList.add('checked');
  else if(n>0)box.classList.add('partial');
  var dis=n===0;
  document.getElementById('batchNo').classList.toggle('disabled',dis);
  document.getElementById('batchYes').classList.toggle('disabled',dis);
}
function batchAction(action){
  if(selected.size===0)return;
  var n=selected.size,ok=action==='approve';
  document.getElementById('modalTitle').textContent=(ok?'批量同意':'批量驳回')+' '+n+' 条审批';
  document.getElementById('modalSub').textContent='确认'+(ok?'同意':'驳回')+'选中的 '+n+' 条审批申请？操作不可撤销。';
  var btn=document.getElementById('modalConfirm');
  btn.textContent=ok?'确认同意':'确认驳回';
  btn.className=ok?'m-confirm-yes':'m-confirm-no';
  btn.onclick=function(){execBatch(action,n)};
  document.getElementById('modalMask').classList.add('show');
}
function execBatch(action,n){
  closeModal();
  var arr=[...selected];
  arr.forEach(function(id){
    var item=DB.todo.find(function(x){return x.id===id});if(!item)return;
    DB.todo.splice(DB.todo.indexOf(item),1);
    item.status=action==='approve'?'approved':'rejected';item.opText='';
    DB.done.unshift(item);
  });
  selected.clear();updateBadge();exitMulti();
  if(document.getElementById('desktopView').classList.contains('show'))renderDesktopList();
  showToast(action==='approve'?'✅ 已同意 '+n+' 条审批':'❌ 已驳回 '+n+' 条审批');
}
function closeModal(){document.getElementById('modalMask').classList.remove('show')}

function cardCls(s){return'card-'+({todo:'todo',mine:'mine',approved:'approved',rejected:'rejected'}[s]||'todo')}

function renderCard(item){
  var isTodo=item.status==='todo',isSel=selected.has(item.id);
  var cbCol=multiMode&&isTodo
    ?'<div class="card-cb-col visible"><div class="rcheck '+(isSel?'checked':'')+'" onclick="event.stopPropagation();toggleItem('+item.id+')"></div></div>'
    :'<div class="card-cb-col"></div>';
  var badge='';
  if(item.status==='todo')badge='<span class="sticker sticker-todo">待审批</span>';
  /* 我发起的 / 我完成的 不显示右上角审批状态 */

  var foot='';
  if(item.status==='approved'||item.status==='rejected'){
    /* 我完成的：显示业务类型 + 时间 + 发起人，不再显示已同意/已拒绝 */
    foot='<div class="card-foot"><span class="type-pill">'+item.type+'</span><div class="card-right"><span class="card-time">'+item.time+'</span><span class="card-who">发起人：'+item.initiator+'</span></div></div>';
  }else if(item.status==='mine'){
    foot='<div class="card-foot"><span class="type-pill">'+item.type+'</span><div class="card-right"><span class="card-time">'+item.time+'</span><span class="card-who">发起人：'+item.initiator+'</span></div></div>';
  }else{
    foot='<div class="card-foot"><span class="type-pill">'+item.type+'</span><div class="card-right"><span class="card-time">'+item.time+'</span><span class="card-who">发起人：'+item.initiator+'</span></div></div>';
  }

  var clickFn=multiMode&&isTodo?'onclick="toggleItem('+item.id+')"':'onclick="openDetail('+item.id+')"';

  return '<div class="card '+cardCls(item.status)+(isSel?' selected':'')+'" '+clickFn+'><div class="card-stripe"></div>'+cbCol+'<div class="card-body"><div class="card-top"><span class="card-title">'+item.title+'</span>'+badge+'</div>'+foot+'</div></div>';
}

function updateBadge(){
  var el=document.getElementById('todoBadge'),n=DB.todo.length;
  el.textContent=n>99?'99+':n;
  el.style.display=n>0?'inline-block':'none';
}
function switchTab(idx,el){
  if(multiMode)return;
  curTab=idx;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('actionBar').style.display=idx===0?'':'none';
  renderList();
}
function renderList(){
  var sorted=sortByTime(lists[curTab]);
  var c=document.getElementById('listContent');
  if(!sorted.length){c.innerHTML='<div class="empty-state"><span class="empty-icon">📭</span><div style="font-size:14px;color:#ccc">暂无记录</div></div>';return}
  c.innerHTML=sorted.map(renderCard).join('');
  if(multiMode)syncMultiUI();
}

function findItem(id){return DB.todo.concat(DB.mine,DB.done).find(function(x){return x.id===id})}

/* ── 构建字段列表 ── */
function buildFields(d,changedFields){
  var cf=changedFields||[];
  var isChanged=function(k){return cf.indexOf(k)>=0};

  var html='';

  /* 1. 方案类别 - 简单标签 */
  html+=renderSimpleField('方案类别',d.cat,'cat',isChanged);

  /* 2. 方案名称 */
  html+=renderSimpleField('方案名称',d.name,'name',isChanged);

  /* 3. 活动编号 */
  html+=renderSimpleField('活动编号',d.code,'code',isChanged);

  /* 4. 活动打折 */
  html+=renderSimpleField('活动打折',d.discount,'discount',isChanged);

  /* 5. 有效期 */
  html+=renderSimpleField('有效期',d.validity,'validity',isChanged);

  /* 6. 授权销售 */
  html+=renderSimpleField('授权销售',d.auth,'auth',isChanged);

  /* 7. 活动详情 - 结构化：金额 / 赠品(赠币/优惠券) */
  html+=renderInfoField('活动详情',d.infoStructured||{},'info',isChanged);

  /* 8. 活动对象 - 结构化：标签列表 + 折叠 */
  html+=renderTagsField('活动对象',d.targetsStructured||{tags:[]},'targets',isChanged);

  /* 9. 活动名额 */
  html+=renderSimpleField('活动名额',d.quota||'不限制','quota',isChanged);

  /* 10. 方案标签 - 标签名称 · 标签值 */
  html+=renderTagPairField('方案标签',d.tagsStructured||null,'tags',isChanged);

  /* 11. 适用门店 - 共N家 + 展开 */
  html+=renderStoresField('适用门店',d.storeList||[],'stores',isChanged);

  /* 12. 销售渠道 - 结构化：渠道 + 门店 */
  html+=renderChannelField('销售渠道',d.channelStructured||{channels:[],shops:[]},'channel',isChanged);

  return html;
}

function renderSimpleField(label,val,key,isChanged){
  var cls='field'+(isChanged(key)?' changed':'');
  return '<div class="'+cls+'"><span class="flabel">'+label+'</span><span class="fval">'+val+'</span></div>';
}

/* 活动详情：金额 / 赠品 */
function renderInfoField(label,info,key,isChanged){
  var cls='field'+(isChanged(key)?' changed':'');
  var rows='';
  if(info.amount)rows+='<div class="info-row"><span class="info-k">金额</span><span class="info-v">'+info.amount+'</span></div>';
  if(info.gifts&&info.gifts.length){
    var giftHtml=info.gifts.map(function(g){
      return '<div class="gift-line"><span class="gift-dot"></span><span class="gift-name">'+g.name+'</span>'+
        (g.qty?'<span class="gift-qty">x'+g.qty+'</span>':'')+
        (g.period?'<span class="gift-period">'+g.period+'</span>':'')+
        '</div>';
    }).join('');
    rows+='<div class="info-row"><span class="info-k">赠品</span><div class="info-v gift-v">'+giftHtml+'</div></div>';
  }
  return '<div class="'+cls+' field-stack"><span class="flabel">'+label+'</span><div class="info-card">'+rows+'</div></div>';
}

/* 活动对象：标签列表 + 折叠 */
function renderTagsField(label,data,key,isChanged){
  var cls='field'+(isChanged(key)?' changed':'');
  var tags=data.tags||[];
  var max=4;
  var visible=tags.slice(0,max);
  var hidden=tags.slice(max);
  var visibleHtml=visible.map(function(t){return '<span class="tag-chip">'+t+'</span>'}).join('');
  var hiddenHtml=hidden.map(function(t){return '<span class="tag-chip">'+t+'</span>'}).join('');
  var toggle='';
  if(hidden.length){
    toggle='<span class="tag-more" onclick="toggleTagMore(this)">+'+hidden.length+'</span>';
  }
  return '<div class="'+cls+' field-stack"><span class="flabel">'+label+'</span><div class="tag-list"><div class="tag-list-visible">'+visibleHtml+toggle+'</div><div class="tag-list-hidden" style="display:none">'+hiddenHtml+'</div></div></div>';
}

function toggleTagMore(el){
  var hidden=el.parentElement.nextElementSibling;
  if(hidden){
    var isShow=hidden.style.display==='block';
    hidden.style.display=isShow?'none':'block';
    el.textContent=isShow?'+'+hidden.children.length:'-收起';
  }
}

/* 方案标签：标签名称 · 标签值 */
function renderTagPairField(label,data,key,isChanged){
  var cls='field'+(isChanged(key)?' changed':'');
  var html='<span class="fval-empty">—</span>';
  if(data&&data.length){
    html=data.map(function(t){return '<span class="tag-pair">'+t.name+' · <span class="tag-pair-v">'+t.value+'</span></span>'}).join('');
  }
  return '<div class="'+cls+'"><span class="flabel">'+label+'</span><div class="tag-pairs">'+html+'</div></div>';
}

/* 适用门店：共N家 + 展开 */
function renderStoresField(label,stores,key,isChanged){
  var cls='field'+(isChanged(key)?' changed':'');
  var count=stores.length;
  var storeItems=stores.map(function(s){return '<div class="store-list-item">'+s+'</div>'}).join('');
  var valHtml='<span class="store-toggle" onclick="toggleStores(this)"><span>共'+count+'家</span><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="#1677FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="store-list">'+storeItems+'</div>';
  return '<div class="'+cls+'"><span class="flabel">'+label+'</span><span class="fval">'+valHtml+'</span></div>';
}

/* 销售渠道：渠道列表 + 门店 */
function renderChannelField(label,data,key,isChanged){
  var cls='field'+(isChanged(key)?' changed':'');
  var html='';
  if(data.channels&&data.channels.length){
    html+=data.channels.map(function(c){return '<span class="ch-chip">'+c+'</span>'}).join('');
  }
  if(data.shops&&data.shops.length){
    html+='<span class="ch-sep">·</span>';
    html+=data.shops.map(function(s){return '<span class="ch-chip ch-shop">'+s+'</span>'}).join('');
  }
  return '<div class="'+cls+'"><span class="flabel">'+label+'</span><div class="ch-list">'+html+'</div></div>';
}

function toggleStores(el){
  el.classList.toggle('expanded');
  var list=el.nextElementSibling;
  if(list)list.classList.toggle('show');
}

function openDetail(id){
  var item=findItem(id);if(!item)return;
  var d=item.d,isDone=item.status==='approved'||item.status==='rejected',isTodo=item.status==='todo',isMine=item.status==='mine';
  var hasOriginal=d.original&&d.changedFields;

  /* 变更审批（有 original）始终显示「变更内容/原方案内容」双 tab；非变更审批无 tab */
  var isChangedApproval=hasOriginal;

  var tabsHtml='';
  var fieldsHtml='';
  if(isChangedApproval){
    tabsHtml='<div class="dtab-wrap"><div class="dtab on" id="dt0" onclick="swDTab(0)">变更内容</div><div class="dtab" id="dt1" onclick="swDTab(1)">原方案内容</div></div>';
    var changedFieldsHtml=buildFields(d,d.changedFields);
    var originalFieldsHtml=buildFields(Object.assign({},d,d.original),null);
    fieldsHtml='<div id="dtContent0" style="display:block">'+changedFieldsHtml+'</div><div id="dtContent1" style="display:none">'+originalFieldsHtml+'</div>';
  }else{
    /* 非变更审批：不显示 tab，直接显示字段 */
    fieldsHtml=buildFields(d,null);
  }

  var bottom;
  if(isDone){
    bottom='<div class="gap-block"></div><div class="sec-hd">审核结果</div><div class="result-card"><div class="result-row"><span class="rlabel">审批人</span><span class="rval">czf77（管理员）</span></div><div class="result-row"><span class="rlabel">审批时间</span><span class="rval">'+item.time+'</span></div><div class="result-row"><span class="rlabel">审批结果</span><span class="rval">'+(item.status==='approved'?'<span class="chip-ok">已通过</span>':'<span class="chip-no">已拒绝</span>')+'</span></div>'+(item.opText?'<div class="result-row" style="flex-direction:column;align-items:flex-start;gap:6px"><span class="rlabel">审批备注</span><span class="rval">'+item.opText+'</span></div>':'')+'</div>';
  }else if(isMine){
    bottom='';
  }else{
    bottom='<div class="gap-block"></div><div class="opinion-wrap"><div class="opinion-lbl">审批意见</div><textarea class="opinion-ta" id="opTa" placeholder="请输入审批意见（选填）\"></textarea></div>';
  }

  /* 流转日志：所有详情页都显示 */
  var logHtml=buildFlowLog(item);

  var footer=isTodo?'<div class="footer"><div class="btn-no" onclick="doAction(\'reject\','+id+')">拒绝</div><div class="btn-yes" onclick="doAction(\'approve\','+id+')">同意</div></div>':'';

  var secTitle=isDone?'审批内容':(isMine?'审批内容':'待审批内容');
  var tabsBlock=tabsHtml?'<div style="padding:0 16px 10px">'+tabsHtml+'</div>':'';
  document.getElementById('detailInner').innerHTML='<div class="sec-hd">'+secTitle+'</div>'+tabsBlock+'<div class="field-group">'+fieldsHtml+'</div>'+bottom+logHtml+'<div style="height:10px"></div>'+footer;
  document.getElementById('listWrap').classList.add('hide');
  document.getElementById('detailView').classList.add('show');
  document.getElementById('backBtn').style.visibility='visible';
  updateBackBadge();
  document.getElementById('navTitle').textContent=item.title.length>11?item.title.slice(0,11)+'…':item.title;
  document.getElementById('detailInner').scrollTop=0;
}

/* 构建流转日志时间线 */
function buildFlowLog(item){
  var logs=[];
  /* 1. 单据提交（发起人） */
  logs.push({stage:'申请',actor:item.initiator,time:item.time,action:'单据提交',first:true,isLast:false});
  /* 2. 审批节点（当前用户的审批记录） */
  if(item.status==='approved'||item.status==='rejected'){
    logs.push({stage:'审批',actor:'czf77（管理员）',time:item.time,action:item.status==='approved'?'同意!':item.opText||'驳回!',isLast:true});
  }else if(item.status==='todo'||item.status==='mine'){
    /* 审批中或待审批：仅显示"待审批"节点 */
    logs.push({stage:'审批',actor:'czf77（管理员）',time:'—',action:'待审批',pending:true,isLast:true});
  }

  var items=logs.map(function(l,i){
    var dotCls=l.first?'flow-dot flow-dot-first':(l.pending?'flow-dot flow-dot-pending':'flow-dot flow-dot-done');
    return '<div class="flow-item">'+
      '<div class="flow-dot-col"><div class="'+dotCls+'"></div>'+(l.isLast?'':'<div class="flow-line"></div>')+'</div>'+
      '<div class="flow-body">'+
        '<div class="flow-row1"><span class="flow-stage">'+l.stage+'</span><span class="flow-actor">'+l.actor+'</span></div>'+
        '<div class="flow-row2">'+l.time+'</div>'+
        '<div class="flow-row3'+(l.pending?' flow-row3-pending':'')+'">'+l.action+'</div>'+
      '</div>'+
    '</div>';
  }).join('');

  return '<div class="gap-block"></div><div class="sec-hd">流转日志</div><div class="flow-log">'+items+'</div>';
}

function updateBackBadge(){
  var el=document.getElementById('backBadge');
  var n=DB.todo.length;
  if(n>0){
    el.textContent=n>99?'99+':n;
    el.style.display='inline-block';
  }else{
    el.style.display='none';
  }
}

function swDTab(i){
  document.getElementById('dt0').classList.toggle('on',i===0);
  document.getElementById('dt1').classList.toggle('on',i===1);
  document.getElementById('dtContent0').style.display=i===0?'block':'none';
  document.getElementById('dtContent1').style.display=i===1?'block':'none';
}

function goBack(){
  document.getElementById('listWrap').classList.remove('hide');
  document.getElementById('detailView').classList.remove('show');
  document.getElementById('backBtn').style.visibility='hidden';
  document.getElementById('backBadge').style.display='none';
  document.getElementById('navTitle').textContent='流程审批';
}
function doAction(action,id){
  var item=DB.todo.find(function(x){return x.id===id});if(!item)return;
  var ta=document.getElementById('opTa');
  if(ta)item.opText=ta.value||'';
  DB.todo.splice(DB.todo.indexOf(item),1);
  item.status=action==='approve'?'approved':'rejected';
  DB.done.unshift(item);updateBadge();
  if(document.getElementById('desktopView').classList.contains('show'))renderDesktopList();
  showToast(action==='approve'?'✅ 已同意该审批':'❌ 已拒绝该审批');
  setTimeout(function(){goBack();renderList()},1300);
}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2200);
}

/* ════════════ 云后台逻辑 ════════════ */
var dCurTab=0,dSelected=new Set();

function updateDesktopBadge(){
  var el=document.getElementById('dTodoBadge'),n=DB.todo.length;
  el.textContent=n>99?'99+':n;
  el.style.display=n>0?'inline-block':'none';
}

function switchDesktopTab(idx,el){
  dCurTab=idx;dSelected.clear();
  document.querySelectorAll('.dv-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('dvToolbar').classList.toggle('show',idx===0);
  renderDesktopList();
}

function renderDesktopList(){
  var sorted=sortByTime(lists[dCurTab]);
  var head=document.getElementById('dvTableHead');
  var isTodo=dCurTab===0;
  head.innerHTML=(isTodo?'<th class="dv-cb-cell"><div class="dv-cb" id="dHeadCb" onclick="toggleDesktopAll()"></div></th>':'')+
    '<th>审批标题</th><th>审批类型</th><th>发起人</th><th>提交时间</th><th>操作</th>';

  var body=document.getElementById('dvTableBody');
  if(!sorted.length){body.innerHTML='<tr><td colspan="'+(isTodo?6:5)+'"><div class="dv-empty">暂无记录</div></td></tr>';return}

  body.innerHTML=sorted.map(function(item){
    var isSel=dSelected.has(item.id);
    var cbCell=isTodo?'<td class="dv-cb-cell"><div class="dv-cb'+(isSel?' checked':'')+'" onclick="event.stopPropagation();toggleDesktopItem('+item.id+')"></div></td>':'';
    var rowClick=isTodo?'onclick="toggleDesktopItem('+item.id+')"':'onclick="openDesktopDetail('+item.id+')"';

    return '<tr '+rowClick+' style="cursor:pointer">'+cbCell+
      '<td class="dv-title-cell" onclick="event.stopPropagation();openDesktopDetail('+item.id+')">'+item.title+'</td>'+
      '<td><span class="dv-type-pill">'+item.type+'</span></td>'+
      '<td>'+item.initiator+'</td>'+
      '<td>'+item.time+'</td>'+
      '<td><span class="dv-action-btn" onclick="event.stopPropagation();openDesktopDetail('+item.id+')">详情</span></td>'+
      '</tr>';
  }).join('');

  syncDesktopUI();
}

function toggleDesktopItem(id){
  if(dSelected.has(id))dSelected.delete(id);else dSelected.add(id);
  renderDesktopList();
}

function toggleDesktopAll(){
  var sorted=sortByTime(DB.todo);
  var allIds=sorted.map(function(x){return x.id});
  if(dSelected.size===allIds.length)dSelected.clear();
  else allIds.forEach(function(id){dSelected.add(id)});
  renderDesktopList();
}

function syncDesktopUI(){
  var n=dSelected.size,total=DB.todo.length;
  document.getElementById('dSelCount').textContent='已选 '+n+' 项';
  var box=document.getElementById('dHeadCb');
  if(box){
    box.className='dv-cb';
    if(n===total&&total>0)box.classList.add('checked');
    else if(n>0)box.classList.add('partial');
  }
  var dis=n===0;
  document.getElementById('dBatchNo').classList.toggle('disabled',dis);
  document.getElementById('dBatchYes').classList.toggle('disabled',dis);
}

function desktopBatchAction(action){
  if(dSelected.size===0)return;
  var n=dSelected.size,ok=action==='approve';
  document.getElementById('dvConfirmTitle').textContent=(ok?'批量同意':'批量驳回')+' '+n+' 条审批';
  document.getElementById('dvConfirmSub').textContent='确认'+(ok?'同意':'驳回')+'选中的 '+n+' 条审批申请？操作不可撤销。';
  var btn=document.getElementById('dvConfirmBtn');
  btn.innerHTML='<div class="dv-batch-btn '+(ok?'dv-batch-approve':'dv-batch-reject')+'" style="border:none;color:#fff;background:'+(ok?'#07C160':'#ef4444')+'" onclick="execDesktopBatch(\''+action+'\','+n+')">'+(ok?'确认同意':'确认驳回')+'</div>';
  document.getElementById('dvConfirmMask').classList.add('show');
}

function execDesktopBatch(action,n){
  closeDvConfirm();
  var arr=[...dSelected];
  arr.forEach(function(id){
    var item=DB.todo.find(function(x){return x.id===id});if(!item)return;
    DB.todo.splice(DB.todo.indexOf(item),1);
    item.status=action==='approve'?'approved':'rejected';item.opText='';
    DB.done.unshift(item);
  });
  dSelected.clear();updateDesktopBadge();renderDesktopList();
  showToast(action==='approve'?'✅ 已同意 '+n+' 条审批':'❌ 已驳回 '+n+' 条审批');
}

function closeDvConfirm(){document.getElementById('dvConfirmMask').classList.remove('show')}

function openDesktopDetail(id){
  var item=findItem(id);if(!item)return;
  var isTodo=item.status==='todo';
  var footer=isTodo?'<div class="btn-no" onclick="desktopDoAction(\'reject\','+id+')">拒绝</div><div class="btn-yes" onclick="desktopDoAction(\'approve\','+id+')">同意</div>':'';
  document.getElementById('dvModalTitle').textContent=item.title;
  document.getElementById('dvModalBody').innerHTML='<div class="dv-detail-hint"><div class="dv-detail-hint-icon">📋</div><div class="dv-detail-hint-txt">详情页面内容与当前云后台版本一致</div><div class="dv-detail-hint-sub">请查看云后台详情页面</div></div>';
  document.getElementById('dvModalFooter').innerHTML=footer;
  document.getElementById('dvModalMask').classList.add('show');
}

function desktopDoAction(action,id){
  var item=DB.todo.find(function(x){return x.id===id});if(!item)return;
  var ta=document.getElementById('dmOpTa');
  if(ta)item.opText=ta.value||'';
  DB.todo.splice(DB.todo.indexOf(item),1);
  item.status=action==='approve'?'approved':'rejected';
  DB.done.unshift(item);updateDesktopBadge();renderDesktopList();
  closeDesktopDetail();
  showToast(action==='approve'?'✅ 已同意该审批':'❌ 已拒绝该审批');
}

function closeDesktopDetail(){document.getElementById('dvModalMask').classList.remove('show')}

/* ── 初始化 ── */
renderList();updateBadge();
</script>
</body>
</html>
